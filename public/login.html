<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="/js/config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #fff; border-radius: 16px; padding: 40px; width: 400px; max-width: 90vw; box-shadow: 0 25px 60px rgba(0,0,0,0.2); }
        .login-card h1 { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 8px; color: #1f2937; }
        .login-card p.subtitle { text-align: center; color: #6b7280; font-size: 14px; margin-bottom: 28px; }
        label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; margin-top: 16px; }
        input { width: 100%; padding: 12px 16px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; transition: border 0.2s; }
        input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 24px; transition: background 0.2s; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        .btn:hover { opacity: 0.9; }
        .error { color: #ef4444; font-size: 13px; text-align: center; margin-top: 12px; display: none; }
        .links { display: flex; gap: 16px; justify-content: center; margin-top: 20px; font-size: 13px; }
        .links a { color: #667eea; text-decoration: none; font-weight: 500; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to access your dashboard</p>

        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username">

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password">

        <button class="btn" onclick="login()">Sign In</button>
        <p class="error" id="errorMsg"></p>

        <div class="links">
    <a href="#" onclick="window.location.href=appUrl('dm.html'); return false;">Direct Messages</a>
    <a href="#" onclick="window.location.href=appUrl('index.html'); return false;">Chat</a>
    <a href="#" onclick="window.location.href=appUrl('profile.html'); return false;">Profile</a>
    <a href="#" onclick="window.location.href=appUrl('users.html'); return false;">Users</a>
    <a href="#" onclick="window.location.href=appUrl('login.html'); return false;">Login</a>
        </div>
    </div>

    <script>
        // If already logged in, redirect
        if (localStorage.getItem('authToken')) {
            window.location.href = '/profile.html';
        }

        // Allow Enter key to submit
        document.getElementById('password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') login();
        });

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('errorMsg');
            errorEl.style.display = 'none';

            if (!username || !password) {
                errorEl.textContent = 'Please enter both username and password.';
                errorEl.style.display = 'block';
                return;
            }

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('userRole', data.role);
                    // Redirect to the page they came from, or profile by default
                    const redirect = new URLSearchParams(window.location.search).get('redirect') || '/profile.html';
                    window.location.href = redirect;
                } else {
                    errorEl.textContent = data.message || 'Login failed.';
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.textContent = 'Network error: ' + err.message;
                errorEl.style.display = 'block';
            }
        }
    </script>
</body>
</html>
